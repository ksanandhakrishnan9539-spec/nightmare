<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nightmare Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <h1 class="logo">NIGHTMARE</h1>
    <div class="cart">🛒 Cart: <span id="cartCount">0</span></div>
  </nav>

  <header class="hero">
    <h2>Enter the Nightmare</h2>
    <p>Dark fashion. Dark vibes.</p>
    <button>Shop Now</button>
  </header>

  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/250x250/000000/ffffff?text=Nightmare+Hoodie">
      <h3>Nightmare Hoodie</h3>
      <p>$45</p>
      <button onclick="addToCart()">Buy</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x250/111111/ffffff?text=Dark+Tee">
      <h3>Dark T-Shirt</h3>
      <p>$25</p>
      <button onclick="addToCart()">Buy</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x250/222222/ffffff?text=Night+Cap">
      <h3>Night Cap</h3>
      <p>$20</p>
      <button onclick="addToCart()">Buy</button>
    </div>
  </section>

  <footer>
    <p>© 2026 NIGHTMARE. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
